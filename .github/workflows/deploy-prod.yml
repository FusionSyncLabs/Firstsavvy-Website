name: Deploy FirstSavvy Website (prod)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: firstsavvy-website-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to FirstSavvy prod droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            APP_DIR=/var/www/firstsavvy/Firstsavvy-Website
            LIVE_DIR=/var/www/firstsavvy/Firstsavvy-Website-live

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            echo "Deploying $(git log -1 --oneline)"

            npm ci --no-audit --no-fund
            NEXT_TELEMETRY_DISABLED=1 npm run build:hostinger

            rsync -a --delete .next/standalone/ "$LIVE_DIR"/
            pm2 reload ecosystem.prod.config.cjs --update-env
            pm2 save

            for i in $(seq 1 10); do
              if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
                echo "Health check passed"; exit 0
              fi
              sleep 3
            done
            echo "Health check FAILED"; pm2 logs firstsavvy-website-prod --lines 30 --nostream; exit 1
